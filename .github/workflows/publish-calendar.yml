name: Publish calendar

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SAGUENAY_ADDRESS: ${{ secrets.SAGUENAY_ADDRESS }}
      SAGUENAY_BUILDING_ID: ${{ secrets.SAGUENAY_BUILDING_ID }}
      CALENDAR_FEED_TOKEN: ${{ secrets.CALENDAR_FEED_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate iCalendar feed
        run: python scripts/build_calendar.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
